<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยอดบริจาค วันศรีนครินทร์ - คณะแพทยศาสตร์ มหาวิทยาลัยขอนแก่น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        
        /* ถังน้ำ (Water Tank) Animation */
        .tank-container {
            width: 100%;
            max-width: 180px;
            height: 300px;
            border: 6px solid #cbd5e1;
            border-radius: 20px 20px 30px 30px;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .water-level {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            transition: height 1s ease-in-out;
            height: 0%;
        }
        /* คลื่นน้ำ */
        .water-level::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -50%;
            width: 200%;
            height: 30px;
            background: rgba(59, 130, 246, 0.7);
            border-radius: 40%;
            animation: wave 3s infinite linear;
        }
        @keyframes wave {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(-25%) rotate(5deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        /* Animation สำหรับการหมุนเวียนรายชื่อผู้บริจาค */
        .ticker-container {
            height: 60px;
            overflow: hidden;
            position: relative;
        }
        .ticker-item {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-in-out;
        }
        .ticker-item.active {
            opacity: 1;
            transform: translateY(0);
        }
        .ticker-item.exit {
            opacity: 0;
            transform: translateY(-20px);
        }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <div class="max-w-md mx-auto p-4 flex flex-col items-center">
        <img src="logo.png" alt="Logo วันศรีนครินทร์" class="h-24 object-contain mt-4 mb-2" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
        
        <h1 class="text-xl font-bold text-center text-blue-900">กองทุนวันศรีนครินทร์</h1>
        <p class="text-xs text-center text-gray-500 mb-4">คณะแพทยศาสตร์ มหาวิทยาลัยขอนแก่น</p>

        <div class="bg-white rounded-2xl shadow-lg p-5 w-full text-center mb-6 border-t-4 border-blue-500">
            <h2 class="text-gray-500 font-semibold text-sm mb-1">ยอดบริจาคปัจจุบัน</h2>
            <div class="text-4xl font-bold text-blue-600 tracking-tight mb-1" id="display-amount">0</div>
            <div class="text-xs text-gray-400">บาท</div>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-5 w-full text-center mb-6 border border-gray-100">
            <span class="bg-blue-50 text-blue-700 text-xs px-3 py-1 rounded-full font-bold inline-block mb-2" id="display-goal-name">กำลังโหลดเป้าหมาย...</span>
            <h2 class="text-gray-600 font-semibold text-sm mb-4">เป้าหมาย: <span id="display-goal" class="text-blue-600 font-bold">0</span> บาท</h2>
            
            <div class="tank-container">
                <div class="water-level" id="water-level"></div>
            </div>
            <p class="mt-3 text-base font-bold text-blue-500" id="percentage-text">0%</p>
        </div>

        <div class="w-full bg-slate-900 text-white rounded-2xl p-4 shadow-lg mb-6">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 flex items-center">
                <span class="flex h-2 w-2 relative mr-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                ผู้บริจาคล่าสุด
            </h3>
            <div class="ticker-container" id="ticker-container">
                <div class="text-center text-sm text-slate-400 py-3">กำลังโหลดข้อมูล...</div>
            </div>
        </div>

        <div class="w-full bg-amber-50 border border-amber-200 rounded-2xl p-4 shadow-sm">
            <h3 class="font-bold text-amber-900 text-sm mb-2 flex items-center">
                <svg class="w-4 h-4 mr-1 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                ช่องทางการร่วมบริจาค
            </h3>
            <div class="text-xs text-amber-950 space-y-1">
                <p><span class="font-semibold text-amber-900 text-sm">ชื่อบัญชี:</span> "กองทุนวันศรีนครินทร์"</p>
                <p><span class="font-semibold text-amber-900 text-sm">ธนาคาร:</span> ไทยพาณิชย์ (SCB)</p>
                <p><span class="font-semibold text-amber-900 text-sm">สาขา:</span> มหาวิทยาลัยขอนแก่น</p>
                <div class="bg-white border border-amber-300 rounded-lg p-2 mt-2 text-center text-base font-bold text-amber-800 tracking-wider">
                    551-2-64185-5
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJ-E8bN9nz_BWKTNofz7ccuVoo6m8LyAU",
            authDomain: "suchart-915bd.firebaseapp.com",
            databaseURL: "https://suchart-915bd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchart-915bd",
            storageBucket: "suchart-915bd.firebasestorage.app",
            messagingSenderId: "94380768305",
            appId: "1:14380768305:web:e4caaed03e46ccc261a910",
            measurementId: "G-6ECF82Z07W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let systemData = null;
        let tickerInterval = null;

        // ดึงข้อมูลการตั้งค่า
        const settingsRef = ref(db, 'settings');
        onValue(settingsRef, (snapshot) => {
            systemData = snapshot.val();
            updateDisplay();
        });

        // ดึงข้อมูลผู้บริจาค
        const donorsRef = ref(db, 'donors');
        onValue(donorsRef, (snapshot) => {
            const donors = snapshot.val();
            if (donors) {
                const donorsArray = Object.values(donors).reverse().slice(0, 5); // เอา 5 คนล่าสุด
                initTicker(donorsArray);
            } else {
                document.getElementById('ticker-container').innerHTML = '<div class="text-center text-sm text-slate-400 py-3">ยังไม่มีข้อมูลผู้บริจาค</div>';
            }
        });

        // ฟังก์ชันจัดการ Animation หมุนเวียนรายชื่อ
        function initTicker(donors) {
            clearInterval(tickerInterval);
            const container = document.getElementById('ticker-container');
            container.innerHTML = '';

            donors.forEach((donor, index) => {
                const item = document.createElement('div');
                item.className = `ticker-item py-2 px-4 flex justify-between items-center text-sm ${index === 0 ? 'active' : ''}`;
                item.innerHTML = `
                    <span class="font-medium text-slate-200">${donor.name}</span>
                    <span class="text-green-400 font-bold bg-slate-800 px-3 py-1 rounded-full">+ ${Number(donor.amount).toLocaleString('th-TH')} ฿</span>
                `;
                container.appendChild(item);
            });

            if (donors.length <= 1) return; // ถ้ารายชื่อเดียวนิ่งไว้ ไม่ต้องหมุน

            let currentIndex = 0;
            tickerInterval = setInterval(() => {
                const items = container.querySelectorAll('.ticker-item');
                if (items.length === 0) return;

                // สลับคลาสเพื่อทำ Animation
                items[currentIndex].classList.remove('active');
                items[currentIndex].classList.add('exit');

                let prevIndex = currentIndex;
                currentIndex = (currentIndex + 1) % items.length;

                items[currentIndex].classList.remove('exit');
                items[currentIndex].classList.add('active');

                // ล้างสถานะเก่าหลังจากอนิเมชันจบ
                setTimeout(() => {
                    items[prevIndex].classList.remove('exit');
                }, 500);

            }, 3500); // เปลี่ยนชื่อทุกๆ 3.5 วินาที
        }

        // ฟังก์ชันคำนวณจำลองยอดเงินวิ่ง
        function updateDisplay() {
            if (!systemData) return;

            const now = Date.now();
            let currentSimulated = systemData.startAmount;

            if (now > systemData.startTime) {
                const totalDuration = systemData.endTime - systemData.startTime;
                const elapsed = now - systemData.startTime;
                
                if (elapsed >= totalDuration) {
                    currentSimulated = systemData.monthlyTotal;
                } else {
                    const progress = elapsed / totalDuration;
                    const amountToAdd = (systemData.monthlyTotal - systemData.startAmount) * progress;
                    // สุ่มตัวเลขกระตุกเล็กน้อยให้เสมือนจริง (+- 2% ของยอดที่เพิ่มขึ้น)
                    const jitter = (Math.sin(now / 10000) * 0.02) * amountToAdd;
                    currentSimulated = systemData.startAmount + amountToAdd + jitter;
                }
            }

            if(currentSimulated > systemData.monthlyTotal) currentSimulated = systemData.monthlyTotal;

            // อัปเดต UI หน้าจอ
            document.getElementById('display-amount').innerText = Math.floor(currentSimulated).toLocaleString('th-TH');
            document.getElementById('display-goal').innerText = Number(systemData.targetGoal).toLocaleString('th-TH');
            document.getElementById('display-goal-name').innerText = systemData.goalName ? `เป้าหมาย: ${systemData.goalName}` : "โครงการวันศรีนครินทร์";

            // คำนวณความสูงน้ำในถัง
            let percent = (currentSimulated / systemData.targetGoal) * 100;
            if (percent > 100) percent = 100;
            
            document.getElementById('water-level').style.height = `${percent}%`;
            document.getElementById('percentage-text').innerText = `${percent.toFixed(2)}%`;
        }

        // อัปเดตหน้าจอทุก 1 นาที
        setInterval(updateDisplay, 60000);
        // เรียกครั้งแรกทันทีก่อนรอ Loop
        setTimeout(updateDisplay, 1000);

    </script>
</body>
</html>
