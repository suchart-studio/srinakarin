<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยอดบริจาค วันศรีนครินทร์ - คณะแพทยศาสตร์ มหาวิทยาลัยขอนแก่น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        
        /* ถังน้ำ (Water Tank) Animation */
        .tank-container {
            width: 100%;
            max-width: 200px;
            height: 350px;
            border: 6px solid #cbd5e1;
            border-radius: 20px 20px 30px 30px;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .water-level {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            transition: height 1s ease-in-out;
            height: 0%; /* Default */
        }
        /* คลื่นน้ำ */
        .water-level::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -50%;
            width: 200%;
            height: 30px;
            background: rgba(59, 130, 246, 0.7);
            border-radius: 40%;
            animation: wave 3s infinite linear;
        }
        @keyframes wave {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(-25%) rotate(5deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <div class="max-w-md mx-auto p-4 flex flex-col items-center">
        <img src="logo.png" alt="Logo วันศรีนครินทร์" class="h-24 object-contain mt-6 mb-4" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
        
        <h1 class="text-xl font-bold text-center text-blue-900 mb-2">กองทุนวันศรีนครินทร์</h1>
        <p class="text-sm text-center text-gray-500 mb-6">คณะแพทยศาสตร์ มหาวิทยาลัยขอนแก่น</p>

        <div class="bg-white rounded-2xl shadow-lg p-6 w-full text-center mb-8 border-t-4 border-blue-500">
            <h2 class="text-gray-500 font-semibold mb-2">ยอดบริจาคปัจจุบัน</h2>
            <div class="text-4xl font-bold text-blue-600 mb-1" id="display-amount">0</div>
            <div class="text-sm text-gray-400">บาท</div>
        </div>

        <div class="mb-4 w-full text-center">
            <h2 class="text-gray-600 font-semibold mb-4">ระดับเป้าหมาย: <span id="display-goal" class="text-blue-600">0</span> บาท</h2>
            <div class="tank-container">
                <div class="water-level" id="water-level"></div>
            </div>
            <p class="mt-4 text-sm font-bold text-blue-500" id="percentage-text">0%</p>
        </div>

        <div class="w-full mt-8">
            <h3 class="font-bold text-lg text-gray-700 mb-4 border-b pb-2">รายชื่อผู้บริจาคล่าสุด</h3>
            <ul id="donor-list" class="space-y-3">
                <li class="text-center text-gray-400 text-sm">กำลังโหลดข้อมูล...</li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJ-E8bN9nz_BWKTNofz7ccuVoo6m8LyAU",
            authDomain: "suchart-915bd.firebaseapp.com",
            databaseURL: "https://suchart-915bd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchart-915bd",
            storageBucket: "suchart-915bd.firebasestorage.app",
            messagingSenderId: "94380768305",
            appId: "1:94380768305:web:e4caaed03e46ccc261a910",
            measurementId: "G-6ECF82Z07W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let systemData = null;

        // ดึงข้อมูลการตั้งค่า
        const settingsRef = ref(db, 'settings');
        onValue(settingsRef, (snapshot) => {
            systemData = snapshot.val();
            updateDisplay();
        });

        // ดึงข้อมูลผู้บริจาค
        const donorsRef = ref(db, 'donors');
        onValue(donorsRef, (snapshot) => {
            const donors = snapshot.val();
            const listEl = document.getElementById('donor-list');
            listEl.innerHTML = '';
            
            if (donors) {
                // แปลง object เป็น array และจัดเรียง
                const donorsArray = Object.values(donors).reverse().slice(0, 5); // เอา 5 คนล่าสุด
                donorsArray.forEach(d => {
                    listEl.innerHTML += `
                        <li class="bg-white p-3 rounded-lg shadow-sm flex justify-between items-center">
                            <span class="font-medium text-gray-700">${d.name}</span>
                            <span class="text-blue-600 font-bold">${Number(d.amount).toLocaleString('th-TH')} ฿</span>
                        </li>
                    `;
                });
            } else {
                listEl.innerHTML = '<li class="text-center text-gray-400 text-sm">ยังไม่มีข้อมูลผู้บริจาค</li>';
            }
        });

        // ฟังก์ชันคำนวณยอดเงินและอัปเดตหน้าจอ
        function updateDisplay() {
            if (!systemData) return;

            const now = Date.now();
            let currentSimulated = systemData.startAmount;

            // คำนวณว่าเวลาผ่านไปเท่าไหร่แล้ว เพื่อจำลองยอดบริจาคค่อยๆ ขึ้น
            if (now > systemData.startTime) {
                const totalDuration = systemData.endTime - systemData.startTime;
                const elapsed = now - systemData.startTime;
                
                if (elapsed >= totalDuration) {
                    currentSimulated = systemData.monthlyTotal; // ถึงยอดของเดือนแล้ว
                } else {
                    const progress = elapsed / totalDuration;
                    const amountToAdd = (systemData.monthlyTotal - systemData.startAmount) * progress;
                    // เพิ่มความ Random เล็กน้อยให้ดูธรรมชาติ (บวกลบไม่เกิน 5%)
                    const randomJitter = (Math.random() * 0.05) * amountToAdd; 
                    currentSimulated = systemData.startAmount + amountToAdd + randomJitter;
                }
            }

            if(currentSimulated > systemData.monthlyTotal) currentSimulated = systemData.monthlyTotal;

            // แสดงผล
            document.getElementById('display-amount').innerText = Math.floor(currentSimulated).toLocaleString('th-TH');
            document.getElementById('display-goal').innerText = Number(systemData.targetGoal).toLocaleString('th-TH');

            // คำนวณเปอร์เซ็นต์ถังน้ำ
            let percent = (currentSimulated / systemData.targetGoal) * 100;
            if (percent > 100) percent = 100;
            
            document.getElementById('water-level').style.height = `${percent}%`;
            document.getElementById('percentage-text').innerText = `${percent.toFixed(2)}%`;
        }

        // อัปเดตยอดจำลองบนหน้าจอทุกๆ 1 นาที (60000 ms)
        setInterval(updateDisplay, 60000);

    </script>
</body>
</html>
